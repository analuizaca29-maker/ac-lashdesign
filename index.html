<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AC Lash Design — Citas</title>
  <meta name="description" content="AC Lash Design — Lashes & Brows by Ana Campos">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #eee5df;
      min-height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, sans-serif;
    }
    .page {
      position: relative;
      width: min(100vw, 706px);
      line-height: 0;
    }
    .art {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .hotspot {
      position: absolute;
      left: 7.7%;
      top: 65.4%;
      width: 84%;
      height: 13.5%;
      display: block;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .catalogo {

  left: 7.7%;

  top: 80.8%;

  width: 84%;

  height: 14%;

  display: block;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

}.hotspot:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="art" src="arte.jpg" alt="AC Lash Design — Ana Campos">
    <a
      class="hotspot"
      href="https://wa.me/34747403186"
      aria-label="Reservar cita por WhatsApp"
      target="_blank"
      rel="noopener">
    </a>
    <a

  class="hotspot catalogo"

  href="https://wa.me/c/34747403186"

  aria-label="Ver catálogo de WhatsApp"

  target="_blank"

  rel="noopener">

</a>
  </main>
</body>
</html>
